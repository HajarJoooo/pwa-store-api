openapi: 3.0.3
info:
  title: 'توثيق واجهة برمجة تطبيقات متجر PWA (PWA Store API)'
  description: 'واجهة برمجة تطبيقات متجر تطبيقات الويب التقدمية (PWA Store) - النسخة v1. توفر واجهات RESTful متكاملة للمصادقة وتصفح التطبيقات والتصنيفات وتثبيت التطبيقات وإدارتها والمراجعات ولوحة تحكم المطورين وبوابة الإشراف والمراجعة.'
  version: 1.0.0
servers:
  -
    url: 'https://pwa-store-api.vercel.app'
tags:
  -
    name: 'المصادقة (Authentication)'
    description: "\nنقاط نهاية إدارة المصادقة، تسجيل المستخدمين والمطورين، تسجيل الدخول، واسترجاع بيانات الملف الشخصي ورموز الوصول."
  -
    name: 'التطبيقات العامة (Public PWAs)'
    description: "\nتصفح تطبيقات الويب التقدمية المنشورة، البحث، التصفية حسب التصنيف، وعرض التفاصيل والمراجعات دون حاجة لتسجيل الدخول."
  -
    name: 'التصنيفات (Categories)'
    description: "\nاسترجاع شجرة التصنيفات النشطة مع عدد التطبيقات المنشورة لكل تصنيف (مخزنة في الكاش)."
  -
    name: 'التثبيت (Installations)'
    description: "\nتثبيت التطبيقات التقدمية للمستخدم المصادق، تتبع عدد التثبيتات، واستعراض سجل التطبيقات المثبتة للمستخدم."
  -
    name: 'المراجعات والتقييمات (Reviews)'
    description: "\nإضافة تقييم ومراجعة للتطبيقات المنشورة (مراجعة واحدة لكل مستخدم)، وتحديث أو حذف المراجعة الخاصة بالمستخدم."
  -
    name: 'لوحة تحكم المطور (Developer Dashboard)'
    description: "\nاستعراض الإحصائيات الشاملة لتطبيقات المطور (إجمالي التطبيقات، التثبيتات، متوسط التقييم، أحدث المراجعات، وأعلى التطبيقات أداءً)."
  -
    name: 'إدارة تطبيقات المطور (Developer PWAs)'
    description: "\nإضافة تطبيقات جديدة، تعديل بيانات التطبيقات المملوكة للمطور، وإعادة تقديم التطبيقات المرفوضة بعد المعالجة."
  -
    name: 'بوابة المشرف (Moderator Portal)'
    description: "\nاستعراض قائمة التطبيقات المعلقة بنظام الأقدم أولاً (FIFO)، فحص بيانات التطبيق والمطور، والموافقة على النشر أو الرفض مع سبب مطهر."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'قم بإرسال الرمز في ترويسة الطلب: `Authorization: Bearer <TOKEN>`. يمكن الحصول على الرمز عبر تسجيل الدخول `/api/v1/auth/login` أو إنشاء حساب `/api/v1/auth/register`.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register a new user with user or developer role.'
      operationId: registerANewUserWithUserOrDeveloperRole
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'المصادقة (Authentication)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  description: 'يجب ألا يتجاوز طول value 100 حرفاً.'
                  example: b
                last_name:
                  type: string
                  description: 'يجب ألا يتجاوز طول value 100 حرفاً.'
                  example: 'n'
                username:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. يجب ألا يتجاوز طول value 50 حرفاً.'
                  example: g
                email:
                  type: string
                  description: 'يجب أن يكون value عنوان بريد إلكتروني صالحاً. يجب ألا يتجاوز طول value 255 حرفاً.'
                  example: rowan.gulgowski@example.com
                password:
                  type: string
                  description: 'يجب أن يتكون value من 8 أحرف على الأقل.'
                  example: 'BNvYgxwmi/#iw/kX'
                phone:
                  type: string
                  description: 'يجب ألا يتجاوز طول value 30 حرفاً.'
                  example: w
                  nullable: true
                role:
                  type: string
                  description: ''
                  example: user
                  enum:
                    - user
                    - developer
              required:
                - first_name
                - last_name
                - username
                - email
                - password
                - role
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Authenticate user by email or username.'
      operationId: authenticateUserByEmailOrUsername
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'المصادقة (Authentication)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: ''
                  example: architecto
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
              required:
                - login
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Return authenticated user profile.'
      operationId: returnAuthenticatedUserProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Authentication is required to access this resource.'
                  data: null
                  errors: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Authentication is required to access this resource.'
                  data:
                    type: string
                    example: null
                    nullable: true
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'المصادقة (Authentication)'
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Revoke the current access token.'
      operationId: revokeTheCurrentAccessToken
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'المصادقة (Authentication)'
      security: []
  /api/v1/pwas:
    get:
      summary: 'Browse and search published PWAs with pagination and filters.'
      operationId: browseAndSearchPublishedPWAsWithPaginationAndFilters
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The given data was invalid.'
                  data: null
                  errors:
                    search:
                      - 'The search field must be at least 2 characters.'
                    category:
                      - 'The selected category is invalid.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  data:
                    type: string
                    example: null
                    nullable: true
                  errors:
                    type: object
                    properties:
                      search:
                        type: array
                        example:
                          - 'The search field must be at least 2 characters.'
                        items:
                          type: string
                      category:
                        type: array
                        example:
                          - 'The selected category is invalid.'
                        items:
                          type: string
      tags:
        - 'التطبيقات العامة (Public PWAs)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 100 characters.'
                  example: b
                  nullable: true
                category:
                  type: string
                  description: 'Must match an existing stored value.'
                  example: architecto
                  nullable: true
                sort:
                  type: string
                  description: ''
                  example: newest
                  enum:
                    - newest
                    - popular
                    - top_rated
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 50.'
                  example: 22
                  nullable: true
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 67
                  nullable: true
      security: []
  '/api/v1/pwas/{slug}':
    get:
      summary: 'Display published PWA details by slug.'
      operationId: displayPublishedPWADetailsBySlug
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'The requested resource was not found.'
                  data: null
                  errors: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The requested resource was not found.'
                  data:
                    type: string
                    example: null
                    nullable: true
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'التطبيقات العامة (Public PWAs)'
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the pwa.'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/pwas/{slug}/reviews':
    get:
      summary: 'List approved reviews for a published PWA.'
      operationId: listApprovedReviewsForAPublishedPWA
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Operation completed successfully.'
                  data: []
                  meta:
                    current_page: 22
                    per_page: 1
                    total: 3
                    last_page: 3
                  links:
                    first: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=1'
                    last: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=3'
                    prev: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=21'
                    next: null
                  errors: null
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Operation completed successfully.'
                  data:
                    type: array
                    example: []
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 22
                      per_page:
                        type: integer
                        example: 1
                      total:
                        type: integer
                        example: 3
                      last_page:
                        type: integer
                        example: 3
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=1'
                      last:
                        type: string
                        example: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=3'
                      prev:
                        type: string
                        example: 'https://pwa-store-api.vercel.app/api/v1/pwas/salati-qibla/reviews?page=21'
                      next:
                        type: string
                        example: null
                        nullable: true
                  errors:
                    type: string
                    example: null
                    nullable: true
      tags:
        - 'التطبيقات العامة (Public PWAs)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sort:
                  type: string
                  description: ''
                  example: newest
                  enum:
                    - newest
                    - helpful
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 50.'
                  example: 1
                  nullable: true
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                  nullable: true
      security: []
    post:
      summary: 'Submit a review for a PWA.'
      operationId: submitAReviewForAPWA
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'المراجعات والتقييمات (Reviews)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  description: 'Must be between 1 and 5.'
                  example: 2
                title:
                  type: string
                  description: 'Must not be greater than 150 characters.'
                  example: 'n'
                  nullable: true
                content:
                  type: string
                  description: 'Must not be greater than 2000 characters.'
                  example: g
                  nullable: true
              required:
                - rating
      security: []
    parameters:
      -
        in: path
        name: slug
        description: 'The slug of the pwa.'
        example: salati-qibla
        required: true
        schema:
          type: string
